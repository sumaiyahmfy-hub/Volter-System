<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Programs – VolunTrack</title><link rel="stylesheet" href="../css/available-programs.css"></head><body><div class="layout"><aside><div class="brand"><i>💙</i>Volun<span>Track</span></div><nav><a href="volunteer-dashboard.html" class="">📊 Dashboard</a><a href="available-programs.html" class="on">🔎 Available Programs</a><a href="my-applications.html" class="">📋 My Applications</a><a href="volunteer-profile.html" class="">👤 Profile</a></nav><a class="out" href="login.html">⎋ Logout</a></aside><main><div class="top"><h2>Available Programs</h2><div class="who"><div class="av">AH</div><div>Ahmad<small>Volunteer</small></div></div></div><div class="fl"><input id="q" placeholder="🔍 Search programs..." oninput="draw()"><select id="c" onchange="draw()"><option value="">All Categories</option><option>Environment</option><option>Community</option><option>Charity</option><option>Health</option><option>Education</option></select></div>
<h3 style="margin-bottom:14px">Available Volunteer Programs</h3><div class="cards" id="cards"></div>
<div class="ov" id="am"><form class="card mdl" onsubmit="return send(event)"><h3 id="at"></h3><dl class="dl" id="ad"></dl><div class="fg"><div><label>Phone Number *</label><input id="ph" value="0123456789"></div><div></div></div>
<label>Previous Volunteer Experience *</label><textarea id="ex" rows="2" placeholder="Enter your experience (or None)"></textarea><label>Reason for Joining *</label><textarea id="rs" rows="3"></textarea><div class="err" id="err"></div><div class="row"><button class="btn">Submit Application</button><button type="button" class="btn ghost" onclick="am.classList.remove('show')">Cancel</button></div></form></div><div id="toast"></div></main></div><script>function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="show";setTimeout(()=>t.className="",2600)}const IC={Environment:"🌿",Community:"🤝",Charity:"💝",Health:"🩸",Education:"📚"};
/* JSP: replace with <c:forEach items="${programs}"> from ProgramServlet?action=list */
const P=[{id:1,t:"Community Clean-Up",c:"Environment",s:"15 Nov 2026",e:"15 Nov 2026",l:"UiTM Shah Alam",cu:40,q:50,h:5,st:"OPEN",d:"Make our campus cleaner and greener."},
{id:2,t:"Food Bank Distribution",c:"Community",s:"22 Nov 2026",e:"22 Nov 2026",l:"UiTM Shah Alam",cu:28,q:30,h:4,st:"OPEN",d:"Pack and distribute food to families in need."},
{id:3,t:"Charity Visit",c:"Charity",s:"29 Nov 2026",e:"29 Nov 2026",l:"Rumah Anak Yatim",cu:25,q:25,h:4,st:"CLOSED",d:"Spend time with children at the orphanage."},
{id:4,t:"Tree Planting",c:"Environment",s:"5 Dec 2026",e:"5 Dec 2026",l:"Taman Botani",cu:15,q:40,h:3,st:"OPEN",d:"Plant saplings and restore green spaces."},
{id:5,t:"Beach Cleanup",c:"Environment",s:"12 Dec 2026",e:"13 Dec 2026",l:"Pantai Klang",cu:10,q:35,h:6,st:"OPEN",d:"Clear plastic waste along the shoreline."},
{id:6,t:"Blood Donation Drive",c:"Health",s:"18 Dec 2026",e:"19 Dec 2026",l:"Dewan Besar",cu:8,q:20,h:3,st:"OPEN",d:"Assist registration at the blood donation drive."}];
let cur=null;const $=i=>document.getElementById(i),am=$("am");
function draw(){const q=$("q").value.toLowerCase(),c=$("c").value;
$("cards").innerHTML=P.filter(p=>p.t.toLowerCase().includes(q)&&(!c||p.c===c)).map(p=>{const full=p.cu>=p.q,off=p.st==="CLOSED"||full;
return `<div class="card pc"><div class="img cv c-${p.c}">${IC[p.c]}</div><span class="chip">${p.c}</span><div class="pb"><h3>${p.t}</h3><small>📅 ${p.s}${p.e!==p.s?" – "+p.e:""}</small><small>📍 ${p.l}</small><small>👥 ${p.q-p.cu} slots left · ⏱️ ${p.h} hours</small><span class="pill ${off?"CLOSED":"OPEN"}" style="align-self:flex-start">${off?(full&&p.st==="OPEN"?"Fully Booked":"Closed"):"Open"}</span><button class="btn" ${off?"disabled":""} onclick="openApply(${p.id})">${off?"Not Available":"Apply Now"}</button></div></div>`}).join("")||'<div class="card empty">No programs found.</div>'}
function openApply(id){cur=P.find(p=>p.id===id);$("at").textContent="Apply: "+cur.t;$("ad").innerHTML=`<dt>Date</dt><dd>${cur.s} – ${cur.e}</dd><dt>Location</dt><dd>${cur.l}</dd><dt>Volunteer Hours</dt><dd>${cur.h} hours</dd><dt>About</dt><dd>${cur.d}</dd>`;$("ex").value=$("rs").value="";$("err").textContent="";am.classList.add("show")}
function send(ev){ev.preventDefault();const b=!/^01\d{8,9}$/.test($("ph").value.trim())?"Enter a valid phone number.":!$("ex").value.trim()?"Please enter your previous experience.":$("rs").value.trim().length<10?"Reason must be at least 10 characters.":"";$("err").textContent=b;if(b)return false;
/* JSP: POST to ApplicationServlet?action=apply, status saved as PENDING */location.href="my-applications.html?applied="+encodeURIComponent(cur.t);return false}
draw()</script></body></html>
