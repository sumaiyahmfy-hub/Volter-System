<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Applications – VolunTrack</title><link rel="stylesheet" href="../css/my-applications.css"></head><body><div class="layout"><aside><div class="brand"><i>💙</i>Volun<span>Track</span></div><nav><a href="volunteer-dashboard.html" class="">📊 Dashboard</a><a href="available-programs.html" class="">🔎 Available Programs</a><a href="my-applications.html" class="on">📋 My Applications</a><a href="volunteer-profile.html" class="">👤 Profile</a></nav><a class="out" href="login.html">⎋ Logout</a></aside><main><div class="top"><h2>My Applications</h2><div class="who"><div class="av">AH</div><div>Ahmad<small>Volunteer</small></div></div></div><div class="tabs" id="tabs"></div><section class="card"><div class="tw"><table><tr><th>Application ID</th><th>Program</th><th>Date Applied</th><th>Status</th><th>Attendance</th><th>Action</th></tr><tbody id="tb"></tbody></table></div></section>
<div class="ov" id="vm"><div class="card mdl"><h3>Application Details</h3><dl class="dl" id="vd"></dl><div class="row"><button class="btn ghost" onclick="vm.classList.remove('show')">Close</button></div></div></div>
<div class="ov" id="fm"><form class="card mdl" onsubmit="return rate(event)"><h3>Program Feedback</h3><p class="sub" id="ft"></p><div id="st" style="margin:8px 0"></div><label>Comments</label><textarea id="fc" rows="3" placeholder="Share your experience"></textarea><div class="row"><button class="btn">Submit</button><button type="button" class="btn ghost" onclick="fm.classList.remove('show')">Cancel</button></div></form></div><div id="toast"></div></main></div><script>function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="show";setTimeout(()=>t.className="",2600)}const $=i=>document.getElementById(i);let F="ALL",cur=null,r=5;
/* JSP: replace with <c:forEach items="${applications}"> from ApplicationServlet?action=mine */
let A=[{id:"APP001",t:"Community Clean-Up",d:"29 Oct 2026",s:"PENDING",a:"-",rm:"Your application is under review.",rt:null},
{id:"APP002",t:"Food Bank Distribution",d:"26 Oct 2026",s:"APPROVED",a:"Not marked",rm:"Well done! Welcome to the program.",rt:null},
{id:"APP003",t:"Charity Visit",d:"20 Oct 2026",s:"REJECTED",a:"-",rm:"Quota prioritised for first-year students.",rt:null},
{id:"APP004",t:"Campus Recycling Day",d:"28 Sep 2026",s:"APPROVED",a:"PRESENT",rm:"Welcome!",rt:null},
{id:"APP005",t:"Orphanage Visit",d:"2 Oct 2026",s:"APPROVED",a:"PRESENT",rm:"Welcome!",rt:5}];
const ap=new URLSearchParams(location.search).get("applied");
if(ap){A.unshift({id:"APP006",t:ap,d:"Today",s:"PENDING",a:"-",rm:"Your application is under review.",rt:null});setTimeout(()=>toast("Application submitted! Awaiting admin approval."),300)}
const pill=s=>`<span class="pill ${s}">${s[0]+s.slice(1).toLowerCase()}</span>`;
function draw(){$("tabs").innerHTML=["ALL","PENDING","APPROVED","REJECTED"].map(s=>`<button class="${F===s?"on":""}" onclick="F='${s}';draw()">${s[0]+s.slice(1).toLowerCase()} (${s==="ALL"?A.length:A.filter(x=>x.s===s).length})</button>`).join("");
$("tb").innerHTML=A.filter(x=>F==="ALL"||x.s===F).map((x,i)=>`<tr><td>${x.id}</td><td><b>${x.t}</b></td><td>${x.d}</td><td>${pill(x.s)}</td><td>${x.a==="PRESENT"?pill("APPROVED").replace("Approved","Present"):x.a}</td><td><div class="acts"><button class="btn ghost sm" onclick="view('${x.id}')">View</button>${x.a==="PRESENT"&&!x.rt?`<button class="btn sm" onclick="fb('${x.id}')">Give Feedback</button>`:x.rt?`<span class="stars">${"★".repeat(x.rt)}</span>`:""}</div></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No applications.</td></tr>'}
function view(id){const x=A.find(a=>a.id===id);$("vd").innerHTML=`<dt>Application ID</dt><dd>${x.id}</dd><dt>Program</dt><dd>${x.t}</dd><dt>Submitted</dt><dd>${x.d}</dd><dt>Status</dt><dd>${pill(x.s)}</dd><dt>Admin Remarks</dt><dd>${x.rm}</dd>`;$("vm").classList.add("show")}
function fb(id){cur=A.find(a=>a.id===id);r=5;$("ft").textContent=cur.t;stars();$("fc").value="";$("fm").classList.add("show")}
function stars(){$("st").innerHTML=[1,2,3,4,5].map(i=>`<span class="star ${i<=r?"on":""}" onclick="r=${i};stars()">★</span>`).join("")}
function rate(ev){ev.preventDefault();/* JSP: POST to ApplicationServlet?action=feedback (saves rating + feedback_comment) */cur.rt=r;$("fm").classList.remove("show");toast("Thank you for your feedback!");draw();return false}
draw()</script></body></html>
